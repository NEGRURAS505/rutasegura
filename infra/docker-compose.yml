services:
  backend:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    env_file:
      - ../.env
    environment:
      MOCK_MODE: ${MOCK_MODE:-true}
      DATABASE_URL: sqlite:////data/rutasegura.db
      UPLOADS_DIR: /data/uploads
    volumes:
      - backend-data:/data
    restart: unless-stopped
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  https:
    image: caddy:2.11.7
    depends_on:
      backend:
        condition: service_healthy
    environment:
      API_HOST: ${API_HOST:?Set API_HOST to a public DNS name for automatic HTTPS}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

volumes:
  backend-data:
  caddy-data:
  caddy-config:
