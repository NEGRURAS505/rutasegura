services:
  backend:
    build:
      context: ../backend
    env_file:
      - ../.env
    environment:
      MOCK_MODE: ${MOCK_MODE:-true}
      DATABASE_URL: sqlite:////data/rutasegura.db
    volumes:
      - backend-data:/data
    restart: unless-stopped
    expose:
      - "8000"

  https:
    image: caddy:2.11.7
    depends_on:
      - backend
    environment:
      API_HOST: ${API_HOST:?Set API_HOST to a public DNS name for automatic HTTPS}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

volumes:
  backend-data:
  caddy-data:
  caddy-config:
