services:
  backend:
    build: ./backend
    container_name: rutasegura-backend
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DATABASE_URL: sqlite:////data/rutasegura.db
      UPLOADS_DIR: /data/uploads
    volumes:
      - rutasegura-data:/data
    restart: unless-stopped

volumes:
  rutasegura-data:
