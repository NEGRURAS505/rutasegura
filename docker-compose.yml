services:
  backend:
    build:
      context: .
      dockerfile: infra/Dockerfile
    container_name: rutasegura-backend
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DATABASE_URL: sqlite:////data/rutasegura.db
      UPLOADS_DIR: /data/uploads
      MOCK_MODE: ${MOCK_MODE:-true}
    volumes:
      - rutasegura-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  rutasegura-data:
